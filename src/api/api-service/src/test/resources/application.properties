spring.application.name=nkst-api-service-test

# H2 In-Memory Database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# Server Port
server.port=0

# Use simple in-memory cache for tests (avoid Redis auto-config)
spring.cache.type=simple
spring.main.allow-bean-definition-overriding=true

# Liquibase for schema management
spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Jwt Configuration
jwt.secret=thisIsMysecregtfrdesww233eggtffeeddgkjjhhtdhttebd54ndhdhfhhhshs8877465sb111
jwt.expiration=3600000
jwt.refreshExpiration=86400000

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Kafka (Producer)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka (Consumer)
spring.kafka.consumer-group-id=api-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Kafka
spring.kafka.consumer.properties.spring.json.trusted.packages=com.mikkytrionze.role.application.dto

# Kafka Topics
spring.kafka.topic.user-updated=user-updated-topic
spring.kafka.topic.member-created=member-created-topic
spring.kafka.topic.church-admin-updated=church-admin-updated-topic
spring.kafka.topic.elder-created=elder-created-topic
spring.kafka.topic.deacon-created=deacon-created-topic
