spring.application.name=church-auth-service

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/church_auth_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.driverClass=com.mysql.cj.jdbc.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# Jwt Configuration
jwt.secret=thisIsMysecregtfrdesww233eggtffeeddgkjjhhtdhttebd54ndhdhfhhhshs8877465sb111
jwt.expiration=3600000
jwt.refreshExpiration=86400000

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# port config
server.port = 81

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Kafka (Producer)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka (Consumer)
spring.kafka.consumer-group-id=auth-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Kafka Topics
spring.kafka.topic.member-created=member-created-topic
spring.kafka.topic.church-admin-updated=church-admin-updated-topic
spring.kafka.topic.user-updated=user-updated-topic
spring.kafka.topic.elder-created=elder-created-topic
spring.kafka.topic.deacon-created=deacon-created-topic

# Kafka
spring.kafka.consumer.properties.spring.json.trusted.packages=com.mikkytrionze.member.application.dto,com.mikkytrionze.churchAdmin.application.dto,com.mikkytrionze.elder.application.dto,com.mikkytrionze.deacon.application.dto
# ENGR-003 Auth governance defaults
auth.access-token.ttl-minutes=15
auth.refresh-token.ttl-days=7
auth.ratelimit.store=redis
auth.ratelimit.signin.max-attempts=5
auth.ratelimit.signin.window-minutes=15
auth.ratelimit.refresh.max-requests=30
auth.ratelimit.refresh.window-minutes=15
auth.ratelimit.reset-otp.max-requests=3
auth.ratelimit.reset-otp.window-minutes=15
auth.ratelimit.stepup-governance.max-requests=10
auth.ratelimit.stepup-governance.window-minutes=15
auth.permission.epoch-cache-ttl-seconds=5
perf.harness.warmup-runs=1
perf.harness.measured-samples=20
# ENGR-003 observability
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.distribution.percentiles-histogram.http.server.request.latency=true
management.metrics.distribution.percentiles.http.server.request.latency=0.95,0.99
logging.pattern.level=%5p [corr:%X{correlationId:-}]
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=200
decorator.datasource.datasource-proxy.logging=slf4j
decorator.datasource.datasource-proxy.query.enable-logging=true
decorator.datasource.datasource-proxy.slow-query.enable-logging=true
decorator.datasource.datasource-proxy.slow-query.threshold=200
