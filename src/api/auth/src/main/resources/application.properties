spring.application.name=nkst-auth-service

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/nkst_auth_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.driverClass=com.mysql.cj.jdbc.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# Jwt Configuration
jwt.secret=thisIsMysecregtfrdesww233eggtffeeddgkjjhhtdhttebd54ndhdhfhhhshs8877465sb111
jwt.expiration=3600000
jwt.refreshExpiration=86400000

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# port config
server.port = 81

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Kafka (Producer)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka (Consumer)
spring.kafka.consumer-group-id=auth-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Kafka Topics
spring.kafka.topic.member-created=member-created-topic
spring.kafka.topic.church-admin-updated=church-admin-updated-topic
spring.kafka.topic.user-updated=user-updated-topic
spring.kafka.topic.elder-created=elder-created-topic
spring.kafka.topic.deacon-created=deacon-created-topic

# Kafka
spring.kafka.consumer.properties.spring.json.trusted.packages=com.mikkytrionze.member.application.dto,com.mikkytrionze.churchAdmin.application.dto,com.mikkytrionze.elder.application.dto,com.mikkytrionze.deacon.application.dto