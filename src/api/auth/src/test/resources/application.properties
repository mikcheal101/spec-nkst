spring.application.name=church-auth-service-test

spring.datasource.url=jdbc:h2:mem:authtestdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.liquibase.enabled=false

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=simple
spring.main.allow-bean-definition-overriding=true

jwt.secret=thisIsMysecregtfrdesww233eggtffeeddgkjjhhtdhttebd54ndhdhfhhhshs8877465sb111
jwt.expiration=3600000
jwt.refreshExpiration=86400000

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-startup=false
spring.kafka.listener.auto-startup=false

auth.access-token.ttl-minutes=15
auth.refresh-token.ttl-days=7
auth.ratelimit.store=local
auth.ratelimit.signin.max-attempts=5
auth.ratelimit.signin.window-minutes=15
auth.ratelimit.refresh.max-requests=30
auth.ratelimit.refresh.window-minutes=15
church.features.memberSelfService=true

spring.kafka.topic.user-updated=user-updated-topic
spring.kafka.topic.member-created=member-created-topic
spring.kafka.topic.church-admin-updated=church-admin-updated-topic
spring.kafka.topic.elder-created=elder-created-topic
spring.kafka.topic.deacon-created=deacon-created-topic
spring.kafka.consumer-group-id=auth-service-group
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,net.ttddyy.observation.boot.autoconfigure.DataSourceObservationAutoConfiguration,org.springframework.boot.actuate.autoconfigure.observation.ObservationAutoConfiguration,org.springframework.boot.actuate.autoconfigure.observation.web.servlet.WebMvcObservationAutoConfiguration
