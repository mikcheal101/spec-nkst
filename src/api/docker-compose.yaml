  #     KAFKA_BOOTSTRAP_SERVERS: kafka:9092


  # ──────────────────────────────────────────────
  # Databases
  # ──────────────────────────────────────────────
  auth-db:
    container_name: identity-auth-db
    image: mysql:8.0
    networks:
      - nkst-network
    volumes:
      - nkst_auth_db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: nkst_auth_db
      MYSQL_USER: sa
      MYSQL_PASSWORD: password
    ports:
      - 3307:3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u sa -p password || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-db:
    container_name: identity-api-db
    image: mysql:8.0
    networks:
      - nkst-network
    volumes:
      - nkst_api_db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: nkst_api_db
      MYSQL_USER: sa
      MYSQL_PASSWORD: password
    ports:
      - 3308:3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u sa -p password || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  announcement-db:
    container_name: identity-announcement-db
    image: mysql:8.0
    networks:
      - nkst-network
    volumes:
      - nkst_announcement_db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: nkst_announcement_db
      MYSQL_USER: sa
      MYSQL_PASSWORD: password
    ports:
      - 3309:3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u sa -p password || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10